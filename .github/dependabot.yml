version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-e-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint ainda não suporta TypeScript 7
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
